[package]
name = "prins-cli"
version = "0.1.0"
edition = "2021"
description = "Draw stickers and labels from the command line, and print them on an M110 over Bluetooth."
license = "MIT"
repository = "https://github.com/lille-morille/prins-stickers"
readme = "README.md"

[lib]
name = "prins"
path = "src/lib.rs"

[[bin]]
name = "prins"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
base64 = "0.23.1"
btleplug = "0.13.5"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
futures = "0.3.34"
hex = "0.4.3"
image = "0.25.10"
imageproc = "0.27.0"
qrcode = "0.14.1"
regex = "1.13.1"
resvg = "0.49.0"
rustybuzz = "0.20.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
ttf-parser = "0.25.1"
unicode-normalization = "0.1.26"
unicode_names2 = "=1.2.2"
ureq = { version = "3.5.1", features = ["json"] }
uuid = "1.29.0"

[profile.release]
lto = "thin"
